<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animate a rigged 3D character with an AI agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── Gestaltungsentscheidung ───────────────────────────────────────────────

     Haltung: Diese Seite ist ein Messsaal, kein Editor. Die Figur ist das
     einzige Helle und das einzig Farbige im Bild; alles andere — Fläche,
     Schrift, Linie — tritt so weit zurück, wie es noch lesbar bleibt, und die
     einzige gesättigte Farbe der Oberfläche (--ruf) steht ausschließlich dort,
     wo der Mensch handeln muss.

     Warum diese: Das Produkt macht einen blinden Agenten sehend, indem es die
     Figur vermisst statt sie zu schätzen (Regel 1, AGENTS.md). Eine Oberfläche,
     die selbst vor der Figur steht, widerspricht ihrem eigenen Versprechen —
     deshalb hat die Bühne keinen Rahmen, keinen Kasten und keine runde Ecke:
     der Szenenhintergrund ist derselbe Ton wie die Seite, die Figur steht im
     Raum statt in einem Fenster. Und deshalb trägt sie einen Höhenmaßstab: die
     gemessenen Meter werden an ihr abgetragen, statt unter ihr behauptet zu
     werden.

     Daraus folgt der Rest:

       Farbe hat drei Bedeutungen, keine vierte. Weiß (--schrift) heißt
       gemessen — jede Zahl, die am Modell entstanden ist, steht in der
       hellsten Stufe. Grau (--leise, --still) heißt Erklärung. Indigo (--ruf)
       heißt: du bist dran. Es gibt keinen dekorativen Einsatz von --ruf; wo es
       leuchtet, wartet die Seite auf einen Klick.

       Typografie trennt Messung von Prosa. Messwerte stehen monospace mit
       gleich breiten Ziffern, Erklärungen serifenlos. Wer die Seite ansieht,
       unterscheidet Behauptung und Messwert, ohne ein Wort zu lesen.

       Beschriftungen sind Instrumentenschrift: 10 px, Versalien, weites
       Tracking, immer grau, nie fett. Sie benennen, sie betonen nicht.

       Es gibt drei Trennlinien auf der ganzen Seite — unter dem Kopf, über der
       Messleiste, links der Spalte — und sonst keine Rahmen. Kästen um jeden
       Inhalt waren der Grund, warum die Seite vorher wie ein Debug-Fenster
       aussah: gleich starke Umrandungen erzeugen gleiches Gewicht, und
       gleiches Gewicht ist keine Hierarchie. */

  :root {
    /* Fläche */
    --grund:   #0e0e10;   /* Seite und Szenenhintergrund — derselbe Ton */
    --bett:    #17171a;   /* die eine Fläche, die sich abheben darf */
    --linie:   #232327;   /* die drei Trennlinien */
    --linie-hell: #33333a;

    /* Schrift */
    --schrift: #f2f1ee;   /* Messwerte und Titel — die hellste Stufe */
    --leise:   #8b8a91;   /* Erklärungen */
    --still:   #64636a;   /* Beschriftungen */

    /* Bedeutung */
    --ruf:     #6d5cff;   /* nur wo der Mensch handeln muss */
    --ruf-hell:#9186ff;
    --fehler:  #e0674c;

    --prosa: system-ui, "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", "Roboto Mono", Consolas, monospace;

    --rand: 32px;   /* der äußere Rand der Seite */
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--grund); color:var(--schrift);
    font:400 13px/1.6 var(--prosa);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* Die Instrumentenschrift: jede Beschriftung auf der Seite sieht gleich aus. */
  .verb-marke, #spur-titel, #einstieg-schritte-titel,
  .wertpaar .beschriftung, .frage-karte .marke {
    font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase;
    color:var(--still); font-family:var(--prosa);
  }
  /* Gemessene Werte, überall auf der Seite gleich gesetzt. */
  .messwert { font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--schrift); }

  /* ── Kopf ─────────────────────────────────────────────────────────────────
     Eine Zeile, drei Angaben: wer, was liegt, wie lädt man neu. Der native
     Datei-Knopf ist verborgen; sichtbar ist ein <label>, das ihn auslöst — der
     weiße "Choose File" des Browsers war der stärkste Stilbruch der Seite. */
  #kopf {
    flex:0 0 auto; display:flex; align-items:center; gap:20px;
    height:56px; padding:0 var(--rand);
    border-bottom:1px solid var(--linie);
    position:relative;
  }
  #marke-name { font-size:13px; font-weight:600; letter-spacing:.01em; white-space:nowrap; }
  #kopf-rechts { margin-left:auto; display:flex; align-items:center; gap:18px; min-width:0; }
  #status {
    font-family:var(--mono); font-size:11.5px; color:var(--leise);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #file {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  #datei-knopf {
    font:inherit; font-size:12px; color:var(--leise); cursor:pointer;
    border:1px solid var(--linie-hell); border-radius:4px; padding:6px 13px;
    white-space:nowrap; transition:color .15s, border-color .15s;
  }
  #datei-knopf:hover { color:var(--schrift); border-color:var(--still); }
  #file:focus-visible + #datei-knopf { outline:2px solid var(--ruf); outline-offset:2px; }

  /* Die Ansicht ist eine Wahl der Bühne, keine Nebenfunktion. Deshalb sitzt
     sie genau zwischen Produktname und Dateiaktion, nicht in einem Seitenmenü. */
  #ansicht { position:absolute; left:50%; transform:translateX(-50%); }
  .ansicht-insel {
    display:flex; align-items:center; gap:2px; padding:3px;
    background:var(--bett); border:1px solid var(--linie-hell); border-radius:999px;
  }
  .ansicht-knopf {
    font:inherit; font-size:11.5px; color:var(--still); cursor:pointer;
    background:transparent; border:0; border-radius:999px; padding:4px 14px;
    transition:color .15s, background .15s;
  }
  .ansicht-knopf:hover { color:var(--schrift); }
  .ansicht-knopf.aktiv { color:var(--schrift); background:var(--linie-hell); }
  .ansicht-knopf:focus-visible { outline:2px solid var(--ruf); outline-offset:2px; }

  /* ── Fehler ───────────────────────────────────────────────────────────────
     Der einzige Ort, an dem die Seite laut wird. Deshalb keine Fläche und kein
     Rahmen ringsum, sondern eine Kante links wie ein Randstrich. */
  #error {
    display:none; flex:0 0 auto; margin:14px var(--rand) 0;
    padding:11px 0 11px 14px; border-left:2px solid var(--fehler);
    color:var(--fehler); font-size:12.5px; white-space:pre-wrap;
  }

  /* ── Bühne ────────────────────────────────────────────────────────────────
     Links die Figur, rechts die Spalte. Zwischen beiden eine Linie und Luft,
     kein Kasten: die Figur soll im Raum stehen, nicht in einem Fenster. */
  #buehne { flex:1 1 auto; min-height:0; display:flex; }
  #stage {
    flex:1 1 auto; min-width:0; min-height:0;
    display:flex; flex-direction:column;
    padding-left:var(--rand);
  }
  #leinwand { flex:1 1 auto; min-height:0; position:relative; }
  /* Das Canvas füllt sein Bett vollständig; seine Pixelgröße setzt das
     Seitenmodul aus der gemessenen Elementgröße, nicht aus einer festen Zahl. */
  #view { display:block; width:100%; height:100%; }

  /* ── Höhenmaßstab ─────────────────────────────────────────────────────────
     Die Signatur der Seite. Die Marken stehen dort, wohin die echte Kamera die
     gemessenen Weltpunkte projiziert (src/ui/hoehenmassstab.js) — sie können
     nicht falsch stehen, ohne dass auch die Figur falsch stünde. */
  #massstab {
    position:absolute; inset:0; pointer-events:none;
    font-family:var(--mono); font-variant-numeric:tabular-nums;
  }
  #massstab[hidden] { display:none; }
  body.welt-ansicht #massstab { display:none !important; }

  /* ── Hinweis auf die Bedienung ────────────────────────────────────────────
     Die Leinwand ist ab jetzt bedienbar, und das sieht man ihr nicht an. Der
     Satz sagt es in der leisesten Schriftstufe, unten links, ausserhalb der
     Blickachse der Figur — und nur, solange eine Figur steht. Er faengt keine
     Maus ab: was hier steht, soll das Ziehen nicht behindern. */
  #bediensatz {
    position:absolute; left:0; bottom:0; margin:0; display:none;
    pointer-events:none; user-select:none;
    font-size:11px; letter-spacing:.01em; color:var(--still);
  }
  body.hat-modell #bediensatz { display:block; }
  .massmarke {
    position:absolute; left:0; height:0;
    display:flex; align-items:center; gap:12px;
  }
  .massmarke-wert {
    flex:0 0 auto; width:78px; text-align:right; white-space:nowrap;
    font-size:10.5px; color:var(--still); line-height:1;
  }
  /* Teilstrich des Rasters: kurz. Die lange Linie ist der Scheitelmarke
     vorbehalten, sonst hätte jede Marke dasselbe Gewicht wie die Körperhöhe. */
  .massmarke-strich { flex:0 0 26px; height:1px; background:var(--linie); }
  /* Die Scheitelmarke trägt die gemessene Körperhöhe — der eine Wert, um den
     sich alles dreht. Sie ist deshalb die einzige helle Marke. */
  .massmarke.scheitel .massmarke-wert { color:var(--schrift); font-size:12px; }
  .massmarke.scheitel .massmarke-strich { flex:1 1 auto; background:var(--linie-hell); }
  /* Kein Platz für die lange Linie (schmale Leinwand, T-Pose): dann behält
     auch die Scheitelmarke den Teilstrich. */
  .massmarke.scheitel.kurz .massmarke-strich { flex:0 0 26px; }
  /* ── Anleitungsspalte ────────────────────────────────────────────────────── */

  /* ── Messleiste unter der Figur ───────────────────────────────────────────
     Der eine Ort für alles, was am Modell gemessen wurde. Der erste Wert ist
     die Körperhöhe und steht groß — die anderen sind ihr Kontext, nicht ihre
     Gleichen. Vor dem ersten Laden leer statt mit Platzhaltern gefüllt: eine 0
     wäre eine Behauptung. */
  #messwerte {
    flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 36px;
    padding:17px 0 21px; border-top:1px solid var(--linie); margin-right:var(--rand);
  }
  #messwerte:empty { display:none; }
  .wertpaar { display:flex; flex-direction:column; gap:6px; }
  .wertpaar .zahl {
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    color:var(--schrift); font-size:13.5px; line-height:1;
  }
  .wertpaar:first-child .zahl { font-size:27px; letter-spacing:-.02em; }
  #messwerte .quelle {
    margin-left:auto; align-self:flex-end; color:var(--still); font-size:11px;
  }

  /* ── Rechte Spalte ────────────────────────────────────────────────────────
     Von oben nach unten in der Reihenfolge, in der es dringend wird:
     Verbindung, Rückfrage, Agentenspur, Anleitung. Keine Karten — die
     Abschnitte trennt Luft und eine Beschriftung, sonst nichts. */
  #seite {
    flex:0 0 clamp(300px, 24vw, 420px); min-height:0;
    display:flex; flex-direction:column;
    /* Abstand über gap, nicht über Ränder an den Abschnitten: die Rückfrage
       wechselt per order ihren Platz, und ein Rand am DOM-Nachbarn säße dann
       an der falschen Stelle. */
    gap:32px;
    padding:26px var(--rand) 24px 26px;
    border-left:1px solid var(--linie);
    overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--linie-hell) transparent;
  }
  #seite > section { flex:0 0 auto; }
  /* Steht eine Rückfrage offen, rückt sie an die Spitze der Spalte. Der Agent
     wartet auf einen Klick — dann ist das der wichtigste Punkt im Bild, und
     kein Zustandsbericht darf darüber stehen. */
  #frage { order:-1; }
  #frage[hidden], #spur[hidden], #hinweis[hidden] { display:none; }

  /* ── Verbindung ───────────────────────────────────────────────────────────
     Die Zahl, um die es bei einem WebMCP-Wettbewerb geht, steht vorn — nicht
     in einem Absatz versteckt. */
  .verb-kopf { display:flex; align-items:center; gap:9px; }
  .verb-punkt {
    width:6px; height:6px; border-radius:50%; background:var(--still); flex:0 0 auto;
  }
  #hinweis.verbunden .verb-punkt { background:var(--ruf); box-shadow:0 0 0 3px rgba(109,92,255,.18); }
  .verb-zustand { margin-left:auto; font-size:11px; color:var(--still); }
  #hinweis.verbunden .verb-zustand { color:var(--leise); }
  .verb-zaehler { margin:15px 0 0; display:flex; align-items:baseline; gap:9px; }
  .verb-zahl {
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:23px; color:var(--schrift); letter-spacing:-.02em; line-height:1;
  }
  .verb-wort { font-size:12px; color:var(--leise); }
  .verb-weg { margin:12px 0 0; font-size:11.5px; line-height:1.6; color:var(--still); }
  .verb-weg[hidden] { display:none; }

  /* ── Rückfrage ────────────────────────────────────────────────────────────
     Der laute Moment der Anwendung: der Agent hält an und will eine Antwort.
     Das ist die einzige Stelle, an der eine Fläche eingefärbt wird. */
  #frage {
    background:var(--bett); border-left:2px solid var(--ruf);
    padding:18px 18px 18px 17px; margin-left:-1px;
  }
  #frage-text { margin:0 0 15px; white-space:pre-wrap; font-size:13.5px; line-height:1.55; }
  /* Zwei Möglichkeiten sind eine Geschmacksfrage und stehen nebeneinander,
     damit man sie vergleicht statt sie zu lesen. Die Spaltenbreite oben ist
     danach bemessen. */
  #frage-optionen { display:grid; gap:8px; }
  /* Zwei Spalten nur, wenn sie auch passen. Befund aus dem Browserlauf: eine
     Rollenfrage mit langen Knochennamen ("nein, sondern mixamorigRightLeg")
     schob die zweite Karte aus dem Panel — der Mensch konnte sie nicht mehr
     lesen und nicht sicher treffen. */
  #frage-optionen.varianten { grid-template-columns:1fr 1fr; }
  #frage-optionen.liste { grid-template-columns:1fr; }
  .frage-karte {
    font:inherit; font-size:12.5px; color:var(--schrift); background:transparent;
    cursor:pointer; border:1px solid var(--linie-hell); border-radius:5px;
    padding:12px 13px; text-align:left; transition:border-color .15s, background .15s;
  }
  .frage-karte:hover { border-color:var(--ruf); background:rgba(109,92,255,.09); }
  .frage-karte:focus-visible { outline:2px solid var(--ruf); outline-offset:2px; }
  .frage-karte.variante { display:flex; flex-direction:column; gap:8px; }
  .frage-karte .marke { color:var(--ruf-hell); }
  /* Der Umbruch, nicht das Stapeln, loest den Ueberlauf: eine Rollenfrage mit
     langen Knochennamen ("nein, sondern mixamorigRightLeg") schob die zweite
     Karte aus dem Panel. Nebeneinander bleiben sie trotzdem — zwei Varianten
     vergleicht man nebeneinander, nicht untereinander. */
  .frage-karte { min-width:0; }
  .frage-karte .titel { line-height:1.45; overflow-wrap:anywhere; hyphens:auto; }
  #frage-hinweis { margin:10px 0 0; color:var(--fehler); font-size:12px; }
  #frage-fuss { display:flex; align-items:center; gap:12px; margin-top:14px; }
  #frage-budget { color:var(--still); font-size:11px; }
  #frage-abbruch {
    font:inherit; font-size:11.5px; color:var(--still); background:none; cursor:pointer;
    border:1px solid var(--linie-hell); border-radius:4px; padding:5px 11px;
  }
  #frage-abbruch:hover { color:var(--schrift); border-color:var(--still); }

  /* ── Agentenspur ──────────────────────────────────────────────────────────
     Der Mensch soll sehen, DASS gearbeitet wird — nicht mitlesen müssen.
     Deshalb ruhig und klein; Farbe nur beim abgelehnten Aufruf. */
  #spur-titel { margin:0 0 14px; }
  /* Festes Fenster statt wachsender Liste.
     Befund aus dem Agentenlauf: jeder Eintrag brachte seine eigene Hoehe mit
     (ein look-Ergebnis fuenf Zeilen, ein describe_pose dreissig). Das Panel
     sprang bei jedem Aufruf und schob den Rest der Spalte weg. Jetzt haben
     alle Zeilen dieselbe Hoehe, die Liste scrollt in sich, die Spalte steht. */
  #spur-liste {
    margin:0; padding:0 8px 0 0; list-style:none;
    max-height:340px; overflow-y:auto; overflow-x:hidden;
    overscroll-behavior:contain;
  }
  /* Lange Werkzeugnamen und Zahlenketten brechen um, statt die Liste seitlich
     zu verbreitern — sonst bekommt das Panel einen zweiten Scrollbalken. */
  .spur-zeile { min-width:0; }
  .spur-zeile .werkzeug, .spur-zeile .ergebnis { min-width:0; overflow-wrap:anywhere; }
  #spur-liste::-webkit-scrollbar { width:6px; }
  #spur-liste::-webkit-scrollbar-track { background:transparent; }
  #spur-liste::-webkit-scrollbar-thumb { background:var(--linie); border-radius:3px; }
  #spur-liste::-webkit-scrollbar-thumb:hover { background:var(--still); }
  .spur-zeile {
    display:grid; grid-template-columns:auto 1fr; gap:3px 11px;
    padding:10px 0; border-top:1px solid var(--linie);
  }
  .spur-zeile:first-child { border-top:none; padding-top:0; }
  .spur-zeile .zeit {
    font-family:var(--mono); font-size:10.5px; color:var(--still);
    font-variant-numeric:tabular-nums; padding-top:2px;
  }
  .spur-zeile .werkzeug { font-size:12.5px; color:var(--schrift); font-weight:500; }
  /* Hoechstens zwei Zeilen je Eintrag: gleiche Hoehe fuer alle, der Rest steht
     im Tooltip. Ohne diese Deckelung bestimmt die laengste Antwort, wie hoch
     das Panel wird. */
  .spur-zeile .ergebnis {
    grid-column:2; color:var(--leise); font-size:11.5px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; overflow-wrap:break-word;
  }
  .spur-zeile.fehler .werkzeug, .spur-zeile.fehler .ergebnis { color:var(--fehler); }

  /* ── Anleitung ────────────────────────────────────────────────────────────
     Bleibt unten stehen, auch wenn der Agent arbeitet: wer die Seite zum
     ersten Mal sieht, soll nie raten müssen, was als Nächstes kommt. */
  /* Die Anleitung steht am Fuß der Spalte, aber nicht am Fuß des Fensters:
     unten festgenagelt sähe sie verlassen aus, wenn darüber wenig steht. */
  #einstieg-spalte { padding-top:14px; }
  #einstieg-schritte-titel { margin:0 0 16px; }
  #einstieg-schritte { margin:0; padding:0; list-style:none; display:grid; gap:17px; }
  .einstieg-punkt { display:grid; grid-template-columns:auto 1fr; gap:3px 11px; }
  .einstieg-punkt .einstieg-nr {
    grid-row:1 / span 2; font-family:var(--mono); font-size:10.5px; color:var(--still);
    font-variant-numeric:tabular-nums; padding-top:2px;
  }
  .einstieg-punkt strong { font-weight:500; font-size:12.5px; color:var(--schrift); }
  .einstieg-punkt .einstieg-wie { color:var(--still); font-size:11.5px; line-height:1.55; }
  .einstieg-punkt code {
    font-family:var(--mono); font-size:11px; color:var(--leise);
  }

  /* ── Abspielleiste unter der 3D-Ansicht ──────────────────────────────────
     Derselbe Ton wie die Messleiste: kein Kasten, nur die Zeile. Sie steht
     auch im Auszustand sichtbar dort — ausgegraut, mit einem Satz, was
     ihr fehlt. Versteckte Steuerungen erklären dem Menschen nicht, worauf
     er wartet. */
  #abs-leiste {
    flex:0 0 auto; padding:10px 0 12px; margin-right:var(--rand);
    border-bottom:1px solid var(--linie);
  }
  #abs-leiste .abs-zeile { display:flex; align-items:center; gap:14px; }
  #abs-leiste.abs-aus { opacity:.5; }
  #abs-leiste .abs-knopf {
    font:inherit; font-size:12px; color:var(--schrift); cursor:pointer;
    background:var(--bett); border:1px solid var(--linie-hell); border-radius:4px;
    padding:6px 16px; transition:border-color .15s;
  }
  #abs-leiste .abs-knopf:hover:not(:disabled) { border-color:var(--still); }
  #abs-leiste .abs-knopf:disabled { cursor:default; }
  #abs-leiste .abs-schieber { flex:1 1 auto; accent-color:var(--ruf); }
  #abs-leiste .abs-frame {
    font-size:11.5px; color:var(--leise); white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  #abs-leiste .abs-tempo { display:flex; gap:4px; }
  #abs-leiste .abs-tempo-knopf {
    font:inherit; font-size:10.5px; color:var(--still); cursor:pointer;
    background:none; border:1px solid var(--linie-hell); border-radius:4px;
    padding:3px 8px; transition:border-color .15s, color .15s;
  }
  #abs-leiste .abs-tempo-knopf:hover:not(:disabled) { color:var(--schrift); }
  #abs-leiste .abs-tempo-knopf.aktiv {
    color:var(--schrift); border-color:var(--ruf);
  }
  #abs-leiste .abs-grund {
    margin:6px 0 0; color:var(--still); font-size:11px; line-height:1.5;
  }
  #abs-leiste .abs-grund[hidden] { display:none; }

  /* Unter 900 px reicht die Breite für zwei Spalten nicht mehr: dann
     untereinander, Bild zuerst — ohne Figur ist die Frage nicht zu beantworten. */
  @media (max-width: 899px) {
    :root { --rand:20px; }
    body { overflow:auto; }
    #buehne { flex-direction:column; }
    #stage { min-height:64vh; padding-right:var(--rand); }
    #seite {
      flex:none; overflow:visible; border-left:none; border-top:1px solid var(--linie);
      padding-left:var(--rand);
      /* src/ui/frage-panel.js setzt der Spalte per Inline-Stil eine
         Maximalbreite von 420 px — richtig für die Rückfrage im zweispaltigen
         Layout, falsch, sobald die Spalte unter dem Bild über die volle Breite
         läuft: die Trennlinie bräche dann mitten im Bild ab. Inline schlägt
         CSS, deshalb hier !important. */
      max-width:none !important;
    }
  }
  @media (max-width: 620px) {
    :root { --rand:14px; }
    #status { display:none; }
    .ansicht-knopf { padding:4px 11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
<!-- Alle Pfade relativ zum Dokument, keiner ab Wurzel. Die Seite muss auch unter
     einem Unterpfad ausgeliefert werden können (…/webmcp/), sonst lädt three.js
     dort nicht und die Seite ist tot. Geprüft in tools/browser-test.mjs. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/"

}

<script>
// Fehleroberfläche der Seite — läuft VOR dem Modul, weil genau das der
// nachgewiesene Fehlerfall war: ein nicht auflösbares Modul im Import-Graphen
// hindert das Seitenmodul daran, auch nur ausgeführt zu werden. Dann ist weit
// und breit kein Handler registriert, die Datei-Auswahl tut sichtbar nichts.
// Ein kaputter Weg muss sich also melden, bevor irgendetwas anderes passiert.
window.__boot = { fehlerr: [], bereit: false, start: performance.now() };
window.addEventListener('error', (e) => {
  const ziel = e.target;
  // Nur eigene Skripte und Module; Icon- und Bild-Fehlschläge sind kein Ladefehler.
  if (!ziel || (ziel.tagName !== 'SCRIPT' && ziel.tagName !== 'LINK')) return;
  const url = ziel.src || ziel.href || '';
  if (!/\/(vendor|src)\//.test(url)) return;
  window.__boot.fehlerr.push(url);
  meldeModulFehler();
}, true);

function meldeModulFehler() {
  const feld = document.getElementById('error');
  const status = document.getElementById('status');
  if (!feld) return;
  feld.textContent = `Module failed to load (${window.__boot.fehlerr.length}): ` +
    window.__boot.fehlerr.join(', ');
  feld.style.display = 'block';
  if (status) status.textContent = 'No model loaded';
}

// Wächter: meldet sich, wenn das Seitenmodul gar nicht erst ausgeführt wurde.
// Ohne ihn bleibt ein kaputter Import-Graph unsichtbar — der nachgewiesene Fall.
setTimeout(() => {
  if (window.__boot.bereit || window.__boot.fehlerr.length > 0) return;
  window.__boot.fehlerr.push('(no module script executed)');
  meldeModulFehler();
}, 5000);
</script>
</head>
<body>
<header id="kopf">
  <!-- Nur der Name. Dass die Seite WebMCP spricht, sagt der Zähler in der
       rechten Spalte mit einer Zahl — zweimal dasselbe wäre einmal zu viel. -->
  <span id="marke-name">Rig Studio</span>
  <div id="ansicht"></div>
  <div id="kopf-rechts">
    <span id="status">No model loaded</span>
    <input type="file" id="file" accept=".glb,.gltf" aria-label="Open a rigged GLB file">
    <label id="datei-knopf" for="file">Open GLB</label>
  </div>
</header>
<div id="error" role="alert"></div>
<main id="buehne">
  <div id="stage">
    <!-- Das Bett gibt dem Canvas seine Groesse; das Seitenmodul misst sie und
         setzt daraus die Pixelgroesse. Der Massstab und die Titelkarte liegen
         als Auflagen darueber, damit die Figur den ganzen Platz behaelt. -->
    <div id="leinwand">
      <canvas id="view"></canvas>
      <div id="massstab" hidden></div>
      <!-- Der Hinweis auf die Bedienung. Er steht erst, wenn eine Figur da
           ist, an der sich etwas drehen laesst, und er steht in der leisesten
           Stufe: eine Anleitung, die lauter waere als die Messwerte, haette
           das Gewicht falsch verteilt. -->
      <p id="bediensatz" aria-hidden="true"></p>
    </div>
    <!-- Die Abspielleiste steht DIREKT unter der Ansicht, die sie steuert.
         Vorher sass sie unter der Messwertzeile und wirkte wie angeklebt: ein
         Schieberegler ohne sichtbaren Bezug zu dem Bild, das er bewegt. -->
    <section id="abs-leiste"></section>
    <!-- Der eine Ort fuer gemessene Werte, direkt bei der Figur, deren Werte
         es sind. Leer, solange nichts gemessen wurde. -->
    <div id="messwerte"></div>
  </div>
  <aside id="seite">
    <!-- Reihenfolge nach Dringlichkeit: der Verbindungszustand steht immer,
         die Rueckfrage draengt sich davor, die Spur laeuft darunter, und die
         Anleitung bleibt unten stehen, solange Platz ist. -->
    <section id="hinweis"></section>
    <section id="spur" hidden></section>
    <section id="einstieg-spalte"></section>
  </aside>
</main>

<script type="module">
import * as THREE from 'three';
import { loadGLB, validateLoadedModel, getBounds } from './src/scene/load.js';
import { frameCamera } from './src/scene/view.js';
import { createToolLayer } from './src/tools/index.js';
import { KATALOG_SICHTBAR } from './src/tools/catalog.js';
import { echtePorts } from './src/tools/ports.js';
import { mounteSpur, spurKontext, ergebnisZeile } from './src/ui/agentenspur.js';
import { createKnochenLeuchten } from './src/ui/knochen-leuchten.js';
import { mounteAnleitung, ladeBeispielDatei } from './src/ui/einstieg.js';
import { createBodengitter } from './src/ui/bodengitter.js';
import { mounteHoehenmassstab } from './src/ui/hoehenmassstab.js';
import { mounteKamerasteuerung } from './src/ui/kamerasteuerung.js';
import { mounteKamerfolger, WELT_ABSTAND_ANTEIL, WELT_NAH_ANTEIL, WELT_WEIT_ANTEIL,
  WELT_SEITWINKEL, WELT_ZIEL_ANTEIL, WELT_ANHEBUNG_ANTEIL } from './src/ui/kamerfolger.js';
import { mounteAbspieler } from './src/ui/abspieler.js';
import { ANSICHT_EDITOR, ANSICHT_WELT, frameFuerAnsicht, mounteAnsichtsumschalter } from './src/ui/ansichtsmodus.js';
import { stellePose } from './src/render/strip.js';
import { mounteVerbindung } from './src/ui/verbindung.js';
import { KATALOG_GROESSE } from './src/tools/catalog.js';

const canvas = document.getElementById('view');
const leinwand = document.getElementById('leinwand');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// Derselbe Ton wie die Seite (--grund): die Leinwand hat keinen sichtbaren
// Rand mehr, die Naht zwischen Bild und Oberflaeche verschwindet.
scene.background = new THREE.Color(0x0e0e10);

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
// Vorläufige Ansicht; nach dem Laden übernimmt frameCamera aus der Bounding Box.
camera.position.set(0, 1, 4);
camera.lookAt(0, 1, 0);

// Drei Lichter, wie im Fotostudio: kuehles Umgebungslicht von oben, ein
// Fuehrungslicht von schraeg vorn und ein schwaches Gegenlicht, das die
// Silhouette von der Flaeche loest. Die Figur ist das einzige Helle im
// Bild und muss diese Rolle auch tragen koennen.
const studioLicht = new THREE.Group();
studioLicht.add(new THREE.HemisphereLight(0xc8d6ff, 0x1a1a1e, 1.5));
const fuehrung = new THREE.DirectionalLight(0xfff4e8, 2.4);
fuehrung.position.set(3, 6, 5);
studioLicht.add(fuehrung);
const gegenlicht = new THREE.DirectionalLight(0x9fb4ff, 1.1);
gegenlicht.position.set(-4, 3, -4);
studioLicht.add(gegenlicht);
scene.add(studioLicht);

// Die Welt ist keine zweite Animation und keine zweite Three-Szene. Sie ist
// nur die ruhige, räumliche Beleuchtung derselben Figur und derselben Frames.
const weltLicht = new THREE.Group();
weltLicht.visible = false;
weltLicht.add(new THREE.HemisphereLight(0xf4f5f6, 0x7f858b, 1.7));
const weltSonne = new THREE.DirectionalLight(0xfff9f0, 2.3);
weltSonne.castShadow = true;
weltSonne.shadow.mapSize.set(2048, 2048);
weltLicht.add(weltSonne);
scene.add(weltLicht);

const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const hinweisEl = document.getElementById('hinweis');
const messwerteEl = document.getElementById('messwerte');

// Anschlüsse der Werkzeuge an die gemessenen Module. Sie stehen VOR dem ersten
// Upload, weil der Agent die Schicht sofort sieht; das Modell hängt sich später
// mit setzeModell ein. Bis dahin antwortet jedes Werkzeug mit "0 Modelle
// geladen" — nicht mit einer Attrappenzahl.
const werkzeugPorts = echtePorts({ renderer });

let model = null;
// Marker für den fraglichen Knochen (plan.md 6.7, Moment 1). Gehört zum
// geladenen Modell und geht mit ihm.
let leuchten = null;
// Bodengitter auf der gemessenen Bodenebene. Gehört ebenfalls zum Modell:
// ohne Modell gibt es keine gemessene Ebene, auf die es sich legen könnte.
let boden = null;
let weltBoden = null;
let ansicht = ANSICHT_EDITOR;
let ersterBewegungsFrame = null;
let ansichtsumschalter = null;

function entferneWeltBoden() {
  if (!weltBoden) return;
  scene.remove(weltBoden);
  weltBoden.traverse((objekt) => {
    objekt.geometry?.dispose?.();
    if (Array.isArray(objekt.material)) objekt.material.forEach((m) => m.dispose?.());
    else {
      objekt.material?.map?.dispose?.();
      objekt.material?.dispose?.();
    }
  });
  weltBoden = null;
}

/** Das Raster ist eine Textur AUF dem Boden, nicht ein zweites Linienobjekt
 * darüber. Dadurch bleibt es bei jeder Kameraposition geometrisch Teil der
 * Fläche und wird mit ihren Perspektiv- und Nebelwerten ausgeblendet. */
function weltRasterTextur(wiederholungen) {
  const leinwand = document.createElement('canvas');
  leinwand.width = 1024;
  leinwand.height = 1024;
  const ctx = leinwand.getContext('2d');
  if (!ctx) throw new Error('Welt-Raster nicht erzeugbar: 0 Canvas-2D-Kontexte verfügbar');
  const schritte = 8;
  const zelle = leinwand.width / schritte;
  ctx.clearRect(0, 0, leinwand.width, leinwand.height);
  ctx.strokeStyle = 'rgba(69, 79, 90, 0.52)';
  ctx.lineWidth = 2;
  for (let i = 0; i <= schritte; i += 1) {
    const p = Math.round(i * zelle) + 0.5;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, leinwand.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(leinwand.width, p); ctx.stroke();
  }
  const textur = new THREE.CanvasTexture(leinwand);
  textur.wrapS = THREE.RepeatWrapping;
  textur.wrapT = THREE.RepeatWrapping;
  textur.repeat.set(wiederholungen, wiederholungen);
  textur.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return textur;
}

/**
 * Die Präsentationswelt skaliert mit dem geladenen Körper. Sie ist absichtlich
 * nur Boden, Licht und Raum: keine zweite Datenhaltung, keine zweite Figur.
 */
function baueWeltBoden({ groundY, hoehe }) {
  entferneWeltBoden();
  if (!(Number.isFinite(groundY) && Number.isFinite(hoehe) && hoehe > 0)) return;

  // Die Welt endet nicht knapp außerhalb des Kamerabilds. Das Raster behält
  // dabei dieselbe körperrelative Zellgröße wie die bisherige 36-Höhen-Bühne.
  const groesse = hoehe * 640;
  const zellweite = hoehe * 0.225;
  const wiederholungen = groesse / (zellweite * 8);
  const gruppe = new THREE.Group();
  gruppe.name = 'welt-buehne';
  gruppe.userData.hoehe = hoehe;
  const flaeche = new THREE.Mesh(
    new THREE.PlaneGeometry(groesse, groesse),
    new THREE.MeshStandardMaterial({ color: 0xc4c7ca, roughness: 1, metalness: 0 }),
  );
  flaeche.name = 'welt-boden';
  flaeche.rotation.x = -Math.PI / 2;
  flaeche.position.y = groundY - hoehe * 0.001;
  flaeche.receiveShadow = true;
  gruppe.add(flaeche);

  const raster = new THREE.Mesh(
    new THREE.PlaneGeometry(groesse, groesse),
    new THREE.MeshBasicMaterial({
      map: weltRasterTextur(wiederholungen), transparent: true, opacity: 0.72,
      depthWrite: false, fog: true,
    }),
  );
  raster.name = 'welt-raster';
  raster.rotation.x = -Math.PI / 2;
  // Ein Zehntelmillimeter über derselben Fläche verhindert Z-Fighting, ohne
  // dass das Raster als eigene schwebende Ebene lesbar werden kann.
  raster.position.y = groundY + hoehe * 0.00005;
  gruppe.add(raster);

  const halbSchatten = hoehe * 5;
  weltSonne.position.set(hoehe * 2.5, hoehe * 5, hoehe * 3);
  weltSonne.shadow.camera.left = -halbSchatten;
  weltSonne.shadow.camera.right = halbSchatten;
  weltSonne.shadow.camera.top = halbSchatten;
  weltSonne.shadow.camera.bottom = -halbSchatten;
  weltSonne.shadow.camera.near = hoehe * 0.01;
  weltSonne.shadow.camera.far = hoehe * 12;
  weltSonne.shadow.camera.updateProjectionMatrix();

  gruppe.visible = ansicht === ANSICHT_WELT;
  scene.add(gruppe);
  weltBoden = gruppe;
}

/** Die Messkamera setzt beim Orbit eine enge Nahgrenze für den Körper. In der
 * Welt würde sie damit aber den Boden unmittelbar vor der Kamera abschneiden.
 * Deshalb besitzt die Welt ihren eigenen, körperrelativen Sichtbereich. */
function setzeWeltClipEbenen() {
  if (ansicht !== ANSICHT_WELT || !weltBoden) return;
  const hoehe = weltBoden.userData.hoehe;
  if (!(Number.isFinite(hoehe) && hoehe > 0)) return;
  camera.near = hoehe * 0.005;
  camera.far = hoehe * 100;
  camera.updateProjectionMatrix();
}

/** Die Welt startet bewusst nicht frontal wie das Messbild, sondern leicht
 * erhöht und seitlich: Nur so werden Boden, Schatten und Vorwärtsbewegung als
 * Raum gelesen. Danach gehört die Orbit-Kamera wieder dem Menschen. */
function rahmeWelt() {
  if (!model) return;
  const rahmen = steuerung.starteNeu();
  const groesse = new THREE.Vector3();
  rahmen.box.getSize(groesse);
  const hoehe = groesse.y;
  if (!(hoehe > 0)) return;
  // Die gemessene Vorwärtsachse wird nur seitlich gedreht. So bleibt die
  // Ansicht unabhängig vom Modell klar lesbar, aber zeigt echte Tiefe statt
  // wieder die frontale Arbeitsansicht.
  const richtung = rahmen.forward.vector.clone()
    .applyAxisAngle(new THREE.Vector3(0, 1, 0), WELT_SEITWINKEL).normalize();
  const ziel = rahmen.center.clone();
  ziel.y = rahmen.box.min.y + hoehe * WELT_ZIEL_ANTEIL;
  const abstand = hoehe * WELT_ABSTAND_ANTEIL;
  camera.fov = 45;
  steuerung.controls.target.copy(ziel);
  camera.position.copy(ziel)
    .addScaledVector(richtung, abstand)
    .add(new THREE.Vector3(0, hoehe * WELT_ANHEBUNG_ANTEIL, 0));
  camera.lookAt(ziel);
  steuerung.controls.update();
  setzeWeltClipEbenen();
  // Körperrelative Zoomgrenzen der Welt — die des Editors gelten hier nicht:
  // dessen Nahgrenze liegt bei 5 % der Körperhöhe (Gelenklupe), die Welt will
  // den ganzen Körper im Raum.
  steuerung.controls.minDistance = hoehe * WELT_NAH_ANTEIL;
  steuerung.controls.maxDistance = hoehe * WELT_WEIT_ANTEIL;
  folger.ein();
}

function setzeAnsicht(neu) {
  ansicht = neu === ANSICHT_WELT ? ANSICHT_WELT : ANSICHT_EDITOR;
  ansichtsumschalter?.zeige(ansicht);
  const istWelt = ansicht === ANSICHT_WELT;
  document.body.classList.toggle('welt-ansicht', istWelt);
  scene.background.set(istWelt ? 0xa9a9a9 : 0x0e0e10);
  if (istWelt && model) {
    const hoehe = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).y;
    // Der Boden soll vor seinem geometrischen Ende im Horizont verschwinden,
    // nicht als rechteckige Kante gegen den Himmel laufen.
    scene.fog = new THREE.Fog(0xa9a9a9, hoehe * 7, hoehe * 17);
  } else {
    scene.fog = null;
  }
  studioLicht.visible = !istWelt;
  weltLicht.visible = istWelt;
  if (weltBoden) weltBoden.visible = istWelt;
  const editorGitter = scene.getObjectByName('bodengitter');
  if (editorGitter) editorGitter.visible = !istWelt;
  bediensatzEl.textContent = istWelt
    ? 'Drag to orbit · Scroll to zoom · Right-drag to pan · Real movement in world space'
    : 'Drag to orbit · Scroll to zoom · Right-drag to pan · Editor keeps horizontal travel in place';
  if (istWelt) rahmeWelt();
  else {
    folger.aus();
    // Die Zoomgrenzen der Welt (körperrelativ, weit) dürfen nicht im Editor
    // weiterleben — die Rahmung setzt sie dort auf die gemessenen Werte zurück.
    steuerung.zurueck();
    massstab.neuZeichnen();
  }
  return ansicht;
}

// Der Höhenmaßstab an der Figur — die Signatur der Seite. Er liest nur die
// Kamera und die gemessene Bodenebene; die Szene selbst bleibt unberührt.
const massstab = mounteHoehenmassstab({
  wurzel: document.getElementById('massstab'),
  kamera: camera,
});

// Die Hand des Menschen an der Kamera. Sie haengt am Canvas, nicht am Bett:
// der Massstab liegt zwar darueber, faengt aber keine Maus ab
// (pointer-events:none), und der Beispiel-Knopf soll seine Klicks behalten.
//
// rahme() ist der einzige Weg zur Startansicht — frameCamera aus
// src/scene/view.js, unveraendert. Die Steuerung rechnet keine Kameraposition,
// sie ruft die Messung. Deshalb steht nach jeder Rueckkehr und nach jedem
// Modellwechsel exakt der gemessene Wert da.
const steuerung = mounteKamerasteuerung({
  kamera: camera,
  element: canvas,
  rahme: () => {
    if (!model) throw new Error('Kamera nicht rahmbar: 0 Modelle geladen, 1 noetig');
    return frameCamera(camera, model);
  },
  // Der Massstab liest dieselbe Kamera: dreht der Nutzer, wandern seine Marken
  // mit. Ohne diesen Anschluss stuenden die gemessenen Meter nach der ersten
  // Drehung auf den Bildhoehen der alten Ansicht.
  aufAenderung: () => {
    setzeWeltClipEbenen();
    massstab.neuZeichnen();
  },
});

// Der Folger der Weltkamera. Er schiebt Kamera und Drehpunkt um den geglätteten
// Weg der Figur weiter — Drehen und Zoom bleiben unangetastet beim Menschen.
// Erst wenn die Welt gerahmt ist (rahmeWelt, folger.ein()), fährt er mit.
const folger = mounteKamerfolger({ kamera: camera, controls: steuerung.controls });

// Die Abspielleiste. Sie loest die aktuelle Timeline ueber denselben Loeser,
// den auch validate nutzt (werkzeugPorts.solver.loese, src/tools/ports.js:
// ports.solver), und stellt jeden Frame ueber stellePose aus src/render/
// strip.js auf die Szene — das Verfahren zum Aufsetzen einer geloesten Pose
// existiert dort bereits und wird hier nicht neu gebaut. Ohne geloeste
// Bewegung oder ohne Modell steht die Leiste grau mit einem Satz, was fehlt.
//
// fps und frameCount kommen aus dem Sitzungszustand der Werkzeugschicht
// (window.__tools.store, plan.md 5.2): die Timeline-Framerate ist die des
// Stores, nicht eine getippte Zahl.
const bediensatzEl = document.getElementById('bediensatz');
const abspieler = mounteAbspieler({
  wurzel: document.getElementById('abs-leiste'),
  holeBewegung: () => {
    if (!model) {
      throw new Error('0 Modelle geladen — die geloeste Bewegung braucht ein gemessenes Modell');
    }
    const z = window.__tools.store.roh();
    if (!z.frameCount || z.frameCount <= 0) {
      throw new Error('frameCount = ' + z.frameCount + ': die Timeline hat noch keine Laenge — '
        + 'der Agent legt sie mit set_duration fest');
    }
    // Dieselbe Umsetzung wie look und validate (alsStreifenFrame, ports.js):
    // die Frames kommen MIT bones-Tabellen zurück, die stellePose stellt.
    // Der Zustand geht ROH hinein; den Löser-Eingang baut ports über
    // alsTimeline (state.js) — derselbe wie bei measure/look/validate. Die
    // handgebaute Fassung hier hatte `anchors` vergessen: die Anzeige zeigte
    // eine andere Bewegung als die Werkzeuge (Lauf vom 1. September 2026).
    const frames = werkzeugPorts.loeseFuerSzene(z);
    if (!Array.isArray(frames) || frames.length === 0) {
      throw new Error('0 geloeste Frames: der Loeser hat nichts geliefert, '
        + 'es gibt nichts abzuspielen');
    }
    ersterBewegungsFrame = frames[0];
    return { frames, fps: z.fps, frameCount: z.frameCount };
  },
  stelleFrame: (frame) => {
    if (!model) throw new Error('0 Modelle geladen: Frame ' + (frame?.frame ?? '?') + ' nicht stellbar');
    stellePose(model, frameFuerAnsicht(ansicht, frame, ersterBewegungsFrame));
    // Die Weltkamera fährt den Beckenpunkt des Frames mit. Im Editor ist der
    // Folger aus (setzeZiel ignoriert dann) — dort steht die Figur ja auf der
    // Stelle, und die Kamera gehört dem Menschen.
    folger.setzeZiel(frame?.root?.pos);
  },
});
window.__abspieler = abspieler;

ansichtsumschalter = mounteAnsichtsumschalter({
  wurzel: document.getElementById('ansicht'),
  beimWechsel: (neu) => {
    const sichtbar = setzeAnsicht(neu);
    const stand = abspieler.stand();
    // Der Umschalter ist ein bewusster Blickwechsel. Der angehaltene aktuelle
    // Frame bleibt derselbe, nur seine Darstellung wechselt sofort mit.
    if (stand.bereit) abspieler.anfahren(stand.index);
    return sichtbar;
  },
});
setzeAnsicht(ansicht);
window.__ansicht = ansichtsumschalter;

// Zwei Wege zurueck auf die gemessene Ansicht, beide ueber dieselbe Messung.
// Rückkehr in der WELT zielt auf die Welt-Rahmung, nicht auf die des
// Editors — dieselbe Messung, anderer Blick. Der Folger startet darin neu.
function zurueckAnsicht() {
  if (ansicht === ANSICHT_WELT) { rahmeWelt(); return; }
  steuerung.zurueck();
}
canvas.addEventListener('dblclick', () => zurueckAnsicht());
window.addEventListener('keydown', (e) => {
  // Nicht, waehrend jemand tippt, und nicht als zweite Bedeutung einer
  // Tastenkombination.
  const ziel = e.target;
  if (ziel && /^(INPUT|TEXTAREA|SELECT)$/.test(ziel.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'r' || e.key === 'R' || e.key === 'Home') {
    zurueckAnsicht();
    e.preventDefault();
  }
});

/**
 * Bringt Renderer und Kamera auf die tatsächliche Größe des Leinwandbetts.
 *
 * Vorher stand die Leinwand fest auf 960 × 720 px. Bei 1920 Fensterbreite ließ
 * das rechts eine tote Fläche stehen und setzte die Figur in einen Kasten links.
 * Jetzt kommt die Größe aus dem gemessenen Element, und das Seitenverhältnis
 * der Kamera folgt ihr — sonst zöge das Bild in die Breite.
 *
 * frameCamera bleibt unangetastet (mutationsgetestet); sie wird nur erneut
 * aufgerufen, weil ihr Ergebnis vom aspect abhängt. Ohne diesen zweiten Aufruf
 * stünde die Figur nach einer Größenänderung nicht mehr mittig im Bild.
 */
function passeLeinwandAn() {
  const breite = Math.max(1, Math.round(leinwand.clientWidth));
  const hoehe = Math.max(1, Math.round(leinwand.clientHeight));
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(breite, hoehe, false);
  camera.aspect = breite / hoehe;
  camera.updateProjectionMatrix();
  // Neu gerahmt wird nur, solange die Ansicht noch die gemessene ist. Hat der
  // Nutzer gedreht oder herangefahren, gehoert sie ihm: eine Fenstergroessen-
  // aenderung, die ihm die Ansicht wegnimmt, waere ein Ruecksprung, den er
  // nicht ausgeloest hat.
  if (model && steuerung.unberuehrt()) steuerung.starteNeu();
  // Der Maßstab hängt an derselben Kamera: ändert sich die Ansicht, wandern
  // seine Marken mit. Ohne diesen Aufruf stünden sie nach einer
  // Größenänderung auf den Bildhöhen der alten Ansicht.
  massstab.neuZeichnen();
}
new ResizeObserver(passeLeinwandAn).observe(leinwand);
passeLeinwandAn();

/**
 * Schreibt die gemessenen Werte in die Leiste unter der Leinwand — den einen
 * Ort, an dem die Seite zeigt, was sie am Modell gemessen hat.
 *
 * Beschriftung serifenlos, Wert monospace: die Gestaltungsentscheidung im
 * Kopf der Stilangaben trennt Prosa von Messung, und hier fällt sie an.
 *
 * @param {Array<[string, string]>} paare  Beschriftung und gemessener Wert
 * @param {string} [quelle]  woher die Werte stammen, rechtsbündig
 */
function zeigeMesswerte(paare, quelle) {
  const teile = paare.map(([was, wert]) => {
    const paar = document.createElement('span');
    paar.className = 'wertpaar';
    const marke = document.createElement('span');
    marke.className = 'beschriftung';
    marke.textContent = was;
    const zahl = document.createElement('span');
    zahl.className = 'zahl';
    zahl.textContent = wert;
    paar.append(marke, zahl);
    return paar;
  });
  if (quelle) {
    const q = document.createElement('span');
    q.className = 'quelle';
    q.textContent = quelle;
    teile.push(q);
  }
  messwerteEl.replaceChildren(...teile);
}

function showError(message) {
  errorEl.textContent = message;
  errorEl.style.display = 'block';
}
function clearError() {
  errorEl.textContent = '';
  errorEl.style.display = 'none';
}

function removeFromScene() {
  if (leuchten) {
    leuchten.abmelden();
    leuchten = null;
  }
  if (boden) {
    boden.aus();
    boden = null;
  }
  entferneWeltBoden();
  massstab.aus();
  // Ohne Modell gibt es keine gemessene Ansicht, zu der eine Drehung
  // zurueckfuehren koennte — dann ist die Leinwand auch nicht bedienbar.
  steuerung.aus();
  if (model) {
    scene.remove(model);
    model = null;
  }
  document.body.classList.remove('hat-modell');
  // Die Abspielleiste zurück in den Auszustand: ohne Modell gibt es keine
  // gelöste Bewegung, die sie abspielen könnte.
  abspieler.aus();
  messwerteEl.replaceChildren();
}

function describeBox(box) {
  const size = new THREE.Vector3();
  box.getSize(size);
  return `${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m`;
}

/**
 * Baut die geladene Datei in die Szene ein: Skelett prüfen, einhängen,
 * Kamera aus der Bounding Box rahmen, Status melden.
 * Wird auch von __scene.refit() nach Skalierung erneut aufgerufen.
 */
function presentModel(gltf, fileName) {
  removeFromScene();
  model = gltf.scene;
  scene.add(model);
  model.traverse((objekt) => {
    if (!objekt.isMesh) return;
    objekt.castShadow = true;
    objekt.receiveShadow = false;
  });

  const check = validateLoadedModel(gltf);
  const box = getBounds(model);

  // Startansicht aus der Messung, und zugleich der Punkt, auf den die
  // Rueckkehr zielt. starteNeu() ruft frameCamera — ein neues Modell setzt die
  // Kamera also immer auf seine eigenen gemessenen Werte, nie auf die des
  // vorigen.
  steuerung.starteNeu();
  leuchten = createKnochenLeuchten({ scene, model });
  // Der Boden unter der Figur: ohne ihn ist nicht zu sehen, ob die Füße stehen,
  // und Bodenkontakt ist die Größe, an der diese Anwendung Bewegung beurteilt.
  // Die Ebene wird gemessen (Bounding-Box-Unterseite bzw. world.groundY aus dem
  // RigProfile), nie getippt — Regel 1 des Projekts.
  boden = createBodengitter({ scene, model });
  document.body.classList.add('hat-modell');

  // Der Test in tools/browser-test.mjs liest diese Zeile und erwartet die
  // Knochenzahl darin; sie ist der Beleg, dass ein Rig geladen wurde.
  statusEl.textContent = `${fileName} — ${check.boneCount} bones`;

  // Der Maßstab trägt die gemessene Körperhöhe an der Figur ab. Beide Werte
  // kommen aus derselben Messung wie das Bodengitter — nichts davon getippt.
  const stand = boden.stand();
  baueWeltBoden(stand);
  setzeAnsicht(ansicht);
  massstab.zeige({ model, groundY: stand.groundY, hoehe: stand.hoehe });

  // Körperhöhe zuerst: sie ist der Wert, um den sich alles dreht, und steht
  // deshalb groß (siehe .wertpaar:first-child in den Stilangaben).
  zeigeMesswerte([
    ['Height', `${stand.hoehe.toFixed(4)} m`],
    ['Bones', String(check.boneCount)],
    ['Bounds', describeBox(box)],
    ['Ground', `${stand.groundY.toFixed(4)} m`],
  ], 'measured on load');
}

/**
 * Mensch-Moment 1 aus plan.md 6.7: unsichere Rollen bestätigen, sobald ein
 * Modell steht. Die Schwellen (sicher ab 0,90, gefragt ab 0,50) und die Fragen
 * selbst kommen aus src/rig/detect.js; hier wird nur gefragt und angezeigt.
 *
 * Zwei Dinge bleiben bewusst außen vor: Ohne Werkzeugschicht gibt es keinen
 * Agenten, der die Bestätigung braucht — dann wird nicht gefragt. Und eine
 * gescheiterte Erkennung landet in der Spur, nicht im Fehlerfeld: geladen ist
 * das Modell trotzdem, das Fehlerfeld gehört dem Upload.
 */
async function bestaetigeUnsichereRollen(gltf) {
  // Ohne WebMCP-Kontext gibt es keinen Agenten, der die Bestätigung braucht —
  // dann wird nicht gefragt, auch wenn die Schicht steht.
  if (!window.__ui || !window.__ui.hatKontext) return null;
  let profil = null;
  try {
    const { detectRig } = await import('./src/rig/detect.js');
    profil = detectRig(gltf);
  } catch (err) {
    window.__ui.spur.notiere({
      name: 'Role detection', fehler: true, text: err.message
    });
    return null;
  }

  // ABGESCHALTET: es wird niemand mehr nach Rollen gefragt.
  //
  // Die Rueckfrage war fuer fremde Modelle gedacht, deren Rig sich nicht
  // eindeutig vermessen laesst. Am ausgelieferten Modell entsteht sie nie —
  // gemessen am Xbot: 0 Fragen, keine Rolle unter der Sicherheitsschwelle.
  // Was blieb, war ein Fragefenster, das dem Menschen Knochennamen und
  // Konfidenzwerte vorlegte, ohne dass es dafuer einen Anlass gab.
  //
  // Der Weg bleibt im Code (src/ui/rollen-bestaetigung.js, questions aus
  // detect.js) und laesst sich ueber window.__ui.rollenAbfragen(profil) von
  // Hand ausloesen. Fuer den Tag, an dem beliebige Modelle hochgeladen werden
  // duerfen, wird er neu gebaut — dann als Frage, die ein Mensch beantworten
  // kann, zum leuchtenden Koerperteil.
  //
  // Bis dahin: unsichere Rollen bleiben unsicher und stehen im Rig-Bericht.
  // Der Agent sieht sie ueber describe_rig und kann mit ask_human nachfragen,
  // wenn er sie wirklich braucht. Das ist der richtige Weg: der Agent fragt,
  // wenn ihm etwas fehlt — nicht die Seite, weil eine Schwelle unterschritten ist.
  const offene = profil.questions?.length ?? 0;
  window.__ui.spur.notiere({
    name: 'Rollenerkennung',
    text: `${Object.keys(profil.roles ?? {}).length} Rollen zugeordnet, `
      + `${offene} unsicher (nicht nachgefragt)`
  });
  return null;
}

/**
 * Hängt das geladene Modell in die Werkzeuge ein und vermisst es. Erst danach
 * antwortet describe_world mit einer Körperhöhe statt mit "0 Modelle geladen".
 *
 * Die Vermessung darf scheitern, ohne den Upload mitzureißen: das Modell steht
 * dann sichtbar in der Szene, und die Werkzeuge sagen mit Betrag, warum sie es
 * nicht messen konnten. Ein stilles Zurückfallen auf Attrappen gibt es nicht.
 */
async function messeFuerWerkzeuge(gltf, fileName) {
  try {
    const stand = await werkzeugPorts.setzeModell(gltf, { fileName });
    // Die volle Messung ersetzt die Kurzfassung aus presentModel: dieselben
    // Werte, jetzt aus der Vermessung statt nur aus der Bounding Box.
    zeigeMesswerte([
      ['Height', `${stand.hoehe.toFixed(4)} m`],
      ['Bones', String(stand.knochen)],
      ['Segments', String(stand.segmente)],
      ['Roles', String(stand.rollen)],
      ['Ground', `${boden ? boden.stand().groundY.toFixed(4) : '—'} m`],
    ], stand.warnungen > 0 ? `${stand.warnungen} warnings` : 'measured, no warnings');
    if (window.__ui) {
      window.__ui.spur.notiere({
        name: 'Measurement',
        text: `${stand.knochen} bones, ${stand.hoehe.toFixed(4)} m, `
          + `${stand.segmente} segments, ${stand.rollen} roles, `
          + `${stand.fragen} open questions, ${stand.warnungen} warnings`
      });
    }
    return stand;
  } catch (err) {
    werkzeugPorts.loeseModell();
    statusEl.textContent += ' — not measured';
    showError(`Measurement rejected: ${err.message}`);
    if (window.__ui) {
      window.__ui.spur.notiere({ name: 'Measurement', fehler: true, text: err.message });
    }
    return null;
  }
}

async function loadFile(file) {
  clearError();
  if (!file) return;
  try {
    const buffer = await file.arrayBuffer();
    const gltf = await loadGLB(buffer);
    presentModel(gltf, file.name);
    await messeFuerWerkzeuge(gltf, file.name);
    await bestaetigeUnsichereRollen(gltf);
  } catch (err) {
    removeFromScene();
    werkzeugPorts.loeseModell();
    statusEl.textContent = 'No model loaded';
    showError(`Could not load ${file.name}: ${err.message}`);
  }
}

// Der einzige Ladepfad der Seite. Die Datei-Auswahl ruft ihn, und der
// Autostart ruft ihn — mit einem File-Objekt, das aus einem fetch des
// Beispielverzeichnisses entsteht. Nicht zwei Wege bauen: beide Eingänge
// laufen durch dieselben Prüfungen und denselben Fehlerpfad.
window.__ladeDatei = loadFile;

document.getElementById('file').addEventListener('change', (e) => {
  loadFile(e.target.files[0]);
});

// Die drei Schritte in der rechten Spalte: Agent verbinden, Auftrag geben,
// zusiehen. Ohne das weiß ein Erstbesitzer nicht, was als Nächstes kommt.
mounteAnleitung({ spalte: document.getElementById('einstieg-spalte') });

// Die Figur steht sofort da.
//
// Solange es genau EIN mitgeliefertes Modell gibt, ist ein Startbildschirm mit
// "Lade einen Charakter" eine Tür, hinter der immer dasselbe liegt. Der Mensch
// klickt sie weg, der Agent stolpert über eine leere Seite und bekommt bei
// jedem Werkzeug "0 Modelle geladen". Also wird geladen, ohne zu fragen; über
// "Open GLB" oben rechts kommt weiterhin jedes andere Rig herein.
(async () => {
  try {
    await loadFile(await ladeBeispielDatei());
  } catch (e) {
    // Kein stiller Ausfall: schlägt es fehl, sagt die Spur, was war.
    if (window.__ui?.spur) {
      window.__ui.spur.notiere({
        name: 'Start', fehler: true,
        text: `Beispielmodell nicht geladen: ${e.message}`,
      });
    }
  } finally {
    // Dieses Laden ist der einzige Vorgang der Seite, der die Statuszeile
    // schreibt, ohne dass jemand etwas angefasst hat — und er ist erst nach
    // window.__boot.bereit fertig. Wer danach eine eigene Datei einlegt, muss
    // hier warten koennen, sonst ueberschreibt der Nachzuegler sein Ergebnis.
    // Genau das machte den Wuerfel-Negativfall in tools/browser-test.mjs
    // sporadisch rot, sobald die Maschine unter Last stand.
    window.__boot.startmodellFertig = true;
  }
})();

// Für Playwright-Tests und für andere Skripte der Seite. refit() rahmt die
// Kamera nach einer Skalierung des Modells erneut aus der Bounding Box aus —
// kein eingetippter Abstand.
window.__scene = {
  scene,
  camera,
  renderer,
  get model() { return model; },
  refit() {
    if (!model) throw new Error('refit(): no model loaded, 0 objects in the scene');
    steuerung.starteNeu();
  },
  /** Zurueck auf die gemessene Startansicht — derselbe Weg wie Doppelklick. */
  resetView() {
    if (!model) throw new Error('resetView(): no model loaded, 0 objects in the scene');
    return steuerung.zurueck();
  },
  controls: steuerung.controls,
};

// Renderlauf. Ohne ihn wird die Szene nie gezeichnet — die Leinwand bliebe
// schwarz, auch wenn das Modell längst hängt und die Kamera richtig steht.
let letzteZeit = performance.now();
function render() {
  const jetzt = performance.now();
  // Der Abspieler schaltet in der Framerate der Timeline (plan.md 5.2, fps
  // aus dem Sitzungszustand), nicht in der Bildrate des Browsers: er sammelt
  // die verstrichenen Sekunden und schaltet, wenn ein Frame voll ist.
  abspieler.tick((jetzt - letzteZeit) / 1000);
  // Der Folger fährt vor dem Rendern nach — sonst zeichnet das Bild einen
  // Stand, den der Folger im selben Bild schon wieder korrigiert.
  folger.tick((jetzt - letzteZeit) / 1000);
  letzteZeit = jetzt;
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Werkzeugschicht (AP7). Sie wird IMMER gebaut und hängt an den echten
// Anschlüssen — auch ohne document.modelContext. Beim Kontext wird zusätzlich
// registriert; ohne ihn gibt es keinen Empfänger, aber die Schicht steht über
// window.__tools und lässt sich ohne Flag aufrufen und prüfen.
//
// Vorher wurde die Schicht ohne Kontext gar nicht gebaut. Ein Browser ohne Flag
// zeigte dann einen stummen GLB-Viewer, ohne zu sagen, was fehlt.
const hatKontext = !!(document.modelContext
  && typeof document.modelContext.registerTool === 'function');

// Die Spur hängt sich zwischen Schicht und Kontext: sie umwickelt jedes
// registrierte execute und reicht es unverändert weiter. src/tools/ bleibt
// unangetastet, der Agent sieht denselben Werkzeugkatalog wie vorher.
const spur = mounteSpur({ wurzel: document.getElementById('spur') });

// Die 3D-Ansicht folgt dem PROTOKOLL, nicht einer bestimmten Tuer.
//
// Es gibt zwei Wege in die Werkzeugschicht: document.modelContext (der echte
// WebMCP-Weg, den ein Agent im Browser nimmt) und window.__tools.rufe (die
// Seite selbst und die Bruecke). Die Live-Anzeige hing zuerst nur am zweiten.
// Ergebnis im Lauf: das Protokoll rechts fuellte sich mit set_pose-Eintraegen,
// waehrend die Figur stur in der T-Pose stand — der Mensch sah dem Agenten
// beim Tippen zu, nicht beim Arbeiten.
//
// Beide Wege melden in dieselbe Spur. Deshalb haengt die Ansicht jetzt hier:
// wer sich meldet, bewegt auch das Bild.
const spurMitBild = {
  ...spur,
  notiere(eintrag) {
    spur.notiere(eintrag);
    zeigeFrameZumAufruf(eintrag?.name, eintrag?.args);
  },
};

window.__tools = await createToolLayer({
  modelContext: hatKontext ? spurKontext(document.modelContext, spurMitBild) : null,
  ports: werkzeugPorts
});

// ─────────────────────────────────────────────────────────────────────────
// Der Mensch sieht dem Agenten zu
// ─────────────────────────────────────────────────────────────────────────
//
// Befund aus dem ersten Agentenlauf ueber die Bruecke: Der Agent baute in
// zwoelf Aufrufen einen vollstaendigen Sprung — und die Seite sah tot aus.
// Die 3D-Ansicht blieb in der Bindepose stehen, und das Protokoll rechts
// zeigte "1 CALL", obwohl zwoelf gelaufen waren.
//
// Zwei Ursachen, beide hier behoben:
//
//   1. Das Protokoll haengt an spurKontext(), also an document.modelContext.
//      Ein Agent von aussen (tools/webmcp-bridge.mjs) ruft aber ueber
//      window.__tools.rufe auf — dieselbe Schicht, andere Tuer. Diese Tuer
//      hatte keinen Eintrag ins Protokoll.
//   2. Kein Werkzeug hat je die Ansicht nachgezogen. Sichtbar wurde die
//      Arbeit erst, wenn der Mensch selbst am Abspieler zog.
//
// Deshalb wird rufe() hier umwickelt: jeder Aufruf landet im Protokoll, und
// jeder Aufruf, der einen Frame nennt oder die Timeline aendert, stellt die
// Ansicht auf genau diesen Frame. Der Mensch sieht die Figur mitwandern.
//
// Die Werkzeugschicht selbst bleibt unberuehrt (src/tools/), und der Agent
// merkt nichts davon: die Antwort geht unveraendert zurueck.

// Hier stand eine Namensliste der Werkzeuge, nach denen neu geloest wird.
// Sie war unvollstaendig: hold_foot, move_pose und delete_pose fehlten. Wer
// eines davon rief, sah im Browser weiter den Stand von davor — waehrend der
// Loeser laengst etwas anderes rechnete. Der Mensch beurteilte eine Bewegung,
// die es nicht mehr gab, und fand Rucke, die keiner nachmessen konnte.
//
// Statt der Liste fragt die Anzeige den Store, ob sich etwas geruehrt hat
// (store.revision(), src/tools/state.js). Ein neues Werkzeug kann nicht mehr
// vergessen werden: aendert es den Zustand, steigt der Zaehler.
let gesehenerStand = -1;

/**
 * Kurzfassung einer Werkzeugantwort fuers Protokoll.
 *
 * Nimmt bewusst dieselbe Funktion wie der WebMCP-Weg (ergebnisZeile aus
 * agentenspur.js). Vorher stand hier eine zweite, eigene Fassung — und weil
 * die nur die erste Textzeile nahm, stand im Panel bei jeder JSON-Antwort
 * woertlich "{". Eine Kurzfassung, zwei Wege.
 */
function protokollText(antwort) {
  return ergebnisZeile(antwort);
}

const rufeRoh = window.__tools.rufe;
window.__tools.rufe = async (name, args) => {
  const antwort = await rufeRoh(name, args);
  try {
    spur.notiere({
      name,
      fehler: antwort?.isError === true,
      text: protokollText(antwort),
      // Der ungekuerzte Text landet im Tooltip der Zeile.
      voll: (antwort?.content ?? [])
        .filter((c) => c.type === 'text').map((c) => c.text).join(' '),
    });
  } catch { /* das Protokoll darf einen Werkzeugaufruf nie kippen */ }

  // Export: der Mensch bekommt die Datei.
  //
  // export_clip meldet dem Agenten nur die Bytezahl — die Bytes selbst lagen
  // im Anschluss und kamen nirgends an. Ein Beitrag, dessen Ergebnis man nicht
  // herunterladen kann, ist kein Ergebnis. Der Download wird deshalb hier
  // ausgeloest, sobald ein Export durchgelaufen ist.
  if (name === 'export_clip' && antwort?.isError !== true) {
    try {
      const clip = werkzeugPorts.holeLetztenExport?.();
      if (clip && clip.daten) {
        const url = URL.createObjectURL(new Blob([clip.daten], { type: 'model/gltf-binary' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = clip.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        spur.notiere({
          name: 'Download',
          text: `${clip.name}, ${(clip.bytes / 1024).toFixed(0)} KB gespeichert`,
        });
      }
    } catch (e) {
      spur.notiere({ name: 'Download', fehler: true, text: String(e.message || e) });
    }
  }

  zeigeFrameZumAufruf(name, args);
  return antwort;
};

/**
 * Stellt die Ansicht auf den Frame, um den es beim Aufruf ging.
 *
 * @param {string} name  Werkzeugname
 * @param {object} args  Argumente, falls bekannt — daraus kommt der Frame
 */
function zeigeFrameZumAufruf(name, args) {
  // Zwei Anlaesse, unabhaengig voneinander:
  //   geaendert  — der Zustand ist ein anderer als beim letzten Blick, also
  //                muss neu geloest werden, egal welches Werkzeug es war.
  //   gewuenscht — das Werkzeug nennt einen Frame; dorthin springt die
  //                Ansicht, damit der Mensch sieht, worueber der Agent redet.
  const rev = window.__tools?.store?.revision?.();
  const geaendert = Number.isInteger(rev) && rev !== gesehenerStand;
  const gewuenscht = Number.isInteger(args?.frame) ? args.frame
    : (Array.isArray(args?.frames) && Number.isInteger(args.frames[0]) ? args.frames[0] : null);
  if (!geaendert && gewuenscht === null) return;
  try {
    if (geaendert) {
      // pruefe() loest neu und haelt den Bereitschaftszustand fest; ohne
      // diesen Aufruf meldet die Leiste weiter "bereit: false, frameCount: 0".
      abspieler.pruefe();
      gesehenerStand = rev;
    }
    const stand = abspieler.stand();
    if (stand?.bereit) {
      // Nennt das Werkzeug keinen Frame, bleibt die Ansicht auf dem zuletzt
      // gestellten — sie springt nicht grundlos an den Anfang. Gestellt wird
      // trotzdem, sonst zeigt die Szene die alte Loesung.
      const ziel = Math.min(Math.max(gewuenscht ?? stand.index ?? 0, 0), stand.frameCount - 1);
      abspieler.anfahren(ziel);
    }
  } catch { /* noch nichts loesbar: die Leiste sagt selbst, was fehlt */ }
}


// ABGESCHALTET: kein Fragefenster mehr.
//
// Es zeigte zwei Sorten Fragen, und beide waren dem Menschen nicht zumutbar:
// die Bestätigung der Erfolgskriterien (rohes JSON, bei jedem set_intent) und
// die Rollenbestätigung (Knochenname, Rollenkürzel, Konfidenzwert). Am
// ausgelieferten Modell gibt es für die zweite ohnehin keinen Anlass —
// gemessen am Xbot: 0 Rückfragen, keine Rolle unter der Schwelle.
//
// Damit fragt niemand mehr: nicht die Seite, nicht der Agent (ask_human liegt
// in der Kiste, siehe catalog.js). Der Mensch sieht zu und greift über die
// Oberfläche ein, statt Ja/Nein auf Fachfragen zu klicken.
//
// Der Bausatz bleibt vollständig liegen — frage-panel.js, ask-human.js,
// rollen-bestaetigung.js, die questions aus detect.js. Für den Tag, an dem
// beliebige Modelle hochgeladen werden dürfen, wird daraus eine Rückfrage
// gebaut, die ein Mensch beantworten kann: zum leuchtenden Körperteil, in
// ganzen Sätzen, ohne eine einzige Zahl.

window.__ui = {
  spur,
  hatKontext,
  get leuchten() { return leuchten; },
  /** Rueckfrage-Bausatz, abgeschaltet. Wird beim Neubau wieder angehaengt. */
  rollenAbfragen: null,
};
window.__ports = werkzeugPorts;

// Der Verbindungszustand steht immer, nicht nur im Fehlerfall: bei einem
// WebMCP-Wettbewerb ist die Zahl der registrierten Werkzeuge die Kernaussage
// der Seite. Vorher stand sie in einem vierzeiligen Absatz über die volle
// Fensterbreite — das lauteste Element im Bild war eine Fehlermeldung.
//
// Die Katalogzahl kommt aus src/tools/catalog.js, nicht aus dem Text: eine
// getippte 16 wäre eine Behauptung und liefe beim nächsten Werkzeug schief.
const verbindung = mounteVerbindung({ wurzel: hinweisEl });
verbindung.setze({
  verbunden: hatKontext,
  registriert: hatKontext ? window.__tools.getTools().length : 0,
  // Die Zahl, die zaehlt, ist die SICHTBARE. Drei Werkzeuge liegen bewusst in
  // der Kiste (KISTE in catalog.js) und werden nicht registriert; "19 / 22"
  // sah aus, als fehlten drei.
  katalog: KATALOG_SICHTBAR.length,
  wegText: hatKontext
    ? 'An agent can call these tools on this page right now.'
    : 'Open this page in the ChatGPT desktop app, or in Chrome 149+ with '
      + 'chrome://flags/#enable-webmcp-testing enabled. The tools run either way.',
});

window.__boot.bereit = true;
window.__ready = true;
</script>
</body>
</html>
